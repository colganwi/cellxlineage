[flake8]
max-line-length = 120
ignore = E203, W503
# server/common/compute/ancestral_linkage is a vendored copy of pycea's compute
# (kept close to upstream, e.g. uses `l` as a loop var), so it is not linted here
# — same rationale as its exclusion from black in pyproject.toml.
exclude = server/common/fbs/NetEncoding/,server/common/compute/ancestral_linkage/,.git,__pycache__,venv,old,build,dist
