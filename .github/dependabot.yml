version: 2
updates:
  # Keep GitHub Actions current so pinned actions don't rot (e.g. the retired
  # CodeQL/actions v1 that used to hard-fail CI).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Server Python dependencies (security + version bumps).
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # NOTE: npm (client) version updates are intentionally omitted — the vendored
  # cellxgene client pins legacy deps (React 17, etc.) and blanket bumps would be
  # noisy/breaking. GitHub security alerts still cover the client if enabled.
