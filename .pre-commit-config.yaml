# Config for the pre-commit.ci GitHub App. Python/JS formatting + linting is
# handled by the Push Tests workflow (black/flake8/eslint) and the local
# husky/lint-staged hook, so this only adds lightweight, non-overlapping
# structural checks (kept fast and churn-free).
ci:
  autofix_prs: true
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-ast
